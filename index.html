<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #fff;
        }
    </style>
    <title>Mapa de Comercios</title>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script>
        // Inicializa mapa com centro padrão
        var map = L.map('map').setView([-15.7801, -47.9292], 14);

        // Tile layer OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // Placeholder para dados do usuário e dos negócios
        var USER = { id: 'USER_ID', lat: -15.7801, lon: -47.9292, icon: 'URL_DO_USER_ICON' };
        var BUSINESSES = [
            // Exemplo: { postgresId: '1', lat: -15.781, lon: -47.930, icon: 'URL_DO_ICON' }
        ];

        // Cria markers
        var markers = [];

        var userIcon = L.icon({ iconUrl: USER.icon, iconSize: [40, 40] });
        var userMarker = L.marker([USER.lat, USER.lon], { icon: userIcon, customId: USER.id });
        markers.push(userMarker);

        BUSINESSES.forEach(function(b) {
            var icon = L.icon({ iconUrl: b.icon, iconSize: [40, 40] });
            var m = L.marker([b.lat, b.lon], { icon: icon, customId: b.postgresId });
            markers.push(m);
        });

        // Cluster
        var markerCluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        });

        markers.forEach(function(m) {
            m.on('click', function() {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'markerClick',
                    id: this.options.customId
                }));
            });
            markerCluster.addLayer(m);
        });

        map.addLayer(markerCluster);

        // clique no cluster
        markerCluster.on('clusterclick', function(a) {
            var childMarkers = a.layer.getAllChildMarkers();
            var ids = childMarkers.map(m => m.options.customId);
            window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'clusterClick',
                ids: ids
            }));
        });

        // Centraliza no usuário
        map.setView([USER.lat, USER.lon], 14);
    </script>
</body>
</html>
