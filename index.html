<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./resources/ol.css">
  <link rel="stylesheet" href="resources/fontawesome-all.min.css">
  <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
  <link rel="stylesheet" href="./resources/qgis2web.css">

  <!-- OL-EXT para spiderfier -->
  <script src="https://cdn.jsdelivr.net/npm/ol-ext/dist/ol-ext.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-ext/dist/ol-ext.min.css"/>

  <style>
    html, body {
      background-color: #ffffff;
    }
    .ol-control > * {
      background-color: #f8f8f8!important;
      color: #444444!important;
      border-radius: 0px;
    }
    .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
      color: #444444!important;
    }
    .search-layer-input-search {
      background-color: #f8f8f8!important;
    }
    .ol-control > *:focus, .ol-control >*:hover {
      background-color: rgba(248, 248, 248, 0.7)!important;
    } 
    .ol-control {
      background-color: rgba(255,255,255,.4) !important;
      padding: 2px !important;
    } 
    html, body, #map {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="map">
    <div id="popup" class="ol-popup">
      <a href="#" id="popup-closer" class="ol-popup-closer"></a>
      <div id="popup-content"></div>
    </div>
  </div>

  <!-- Scripts do QGIS2WEB -->
  <script src="resources/qgis2web_expressions.js"></script>
  <script src="./resources/functions.js"></script>
  <script src="./resources/ol.js"></script>
  <script src="./resources/ol-layerswitcher.js"></script>
  <script src="./layers/layers.js" type="text/javascript"></script> 
  <script src="./resources/Autolinker.min.js"></script>
  <script src="./resources/qgis2web.js"></script>

  <!-- Ajuste do clique com Spiderfier -->
  <script>
    // aguarda mapa carregar
    window.onload = function() {
      // inicializa spiderfier
      var oms = new ol.ext.OverlappingMarkerSpiderfier(map, {
        keepSpiderfied: true,
        circleSpiralSwitchover: 9,
        spiralDistanceFactor: 7,
        circleFootSeparation: 30
      });

      // adiciona todas as features ao spiderfier
      map.getLayers().forEach(function(layer) {
        if (layer instanceof ol.layer.Vector) {
          var source = layer.getSource();
          if (source && source.getFeatures) {
            source.getFeatures().forEach(f => oms.addFeature(f));
          }
        }
      });

      // substitui o clique de cluster
      map.on('singleclick', function(evt) {
        var clicked = null;
        map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
          if (!clicked) clicked = { feature: feature, layer: layer };
        }, { hitTolerance: 6 });

        if (!clicked) return;

        var feature = clicked.feature;
        var inner = feature.get('features');

        if (inner && inner.length > 1) {
          // cluster → espalha em círculo
          oms.unspiderfy();
          oms.spiderfyAt(evt.coordinate, inner);
          return;
        }

        // se for único → loga ID (ou manda pro React Native)
        var single = inner && inner.length === 1 ? inner[0] : feature;
        var id = single && single.get ? single.get('customId') : null;
        if (id) {
          console.log("Clicou no marker:", id);
          // window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'markerClick', id: id }));
        }
      });
    }
  </script>
</body>
</html>
